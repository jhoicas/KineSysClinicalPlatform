version: "3.8"

services:
  frontend:
    build: ./frontend
    ports: ["3005:3000"]
    environment:
      # Browser clients cannot resolve the Docker service name "backend".
      # Override with the public Go API URL for deployed environments.
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8085}
    depends_on: [backend]

  backend:
    build: ./backend
    ports: ["8085:8080"]
    env_file: ./backend/.env